<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="balenoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef0f3"/>
      <stop offset="100%" stop-color="#c9ccd2"/>
    </linearGradient>
    <linearGradient id="balenoGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454b57"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
    <radialGradient id="wheelG" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#111114"/>
    </radialGradient>
    <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e9ec"/>
      <stop offset="100%" stop-color="#9a9ca3"/>
    </linearGradient>
    <linearGradient id="floorShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="300" rx="300" ry="18" fill="url(#floorShadow)"/>

  <g>
    <!-- body -->
    <path d="M92 220
      C 92 205 100 196 118 190
      L 172 178
      C 196 150 232 112 268 96
      C 300 82 336 76 372 76
      L 470 76
      C 512 76 548 88 578 112
      L 622 148
      L 672 156
      C 700 160 716 178 718 202
      L 720 224
      C 720 236 712 244 700 244
      L 660 244
      C 660 214 636 190 606 190
      C 576 190 552 214 552 244
      L 268 244
      C 268 214 244 190 214 190
      C 184 190 160 214 160 244
      L 118 244
      C 102 244 92 234 92 220 Z"
      fill="url(#balenoBody)" stroke="#b7bac1" stroke-width="1.5"/>

    <!-- roofline accent -->
    <path d="M268 96 C 300 82 336 76 372 76 L 470 76 C 512 76 548 88 578 112 L 622 148"
      fill="none" stroke="#d8dade" stroke-width="2"/>

    <!-- greenhouse / glass -->
    <path d="M282 176
      C 308 138 338 108 372 100
      L 452 100
      C 486 100 516 116 540 142
      L 560 176 Z"
      fill="url(#balenoGlass)"/>
    <path d="M372 100 L 372 176 M452 100 L 452 176" stroke="#0f1116" stroke-width="3"/>

    <!-- door lines & handle -->
    <path d="M372 178 L 372 244 M452 178 L 452 244" stroke="#c3c6cc" stroke-width="1.5"/>
    <rect x="392" y="182" width="20" height="4" rx="2" fill="#9a9ca3"/>
    <rect x="472" y="182" width="20" height="4" rx="2" fill="#9a9ca3"/>

    <!-- front bumper detail -->
    <path d="M118 190 L 172 178" stroke="#9a9ca3" stroke-width="1.5"/>
    <rect x="98" y="206" width="34" height="10" rx="5" fill="#0f1116"/>
    <circle cx="112" cy="200" r="5" fill="#f4e2b8"/>

    <!-- rear light -->
    <rect x="686" y="196" width="10" height="26" rx="4" fill="#e5544d"/>

    <!-- badge grille hint -->
    <rect x="120" y="222" width="46" height="14" rx="3" fill="#e2e4e8" stroke="#b7bac1"/>

    <!-- wheels -->
    <g>
      <circle cx="214" cy="244" r="46" fill="url(#wheelG)"/>
      <circle cx="214" cy="244" r="24" fill="url(#rimG)"/>
      <circle cx="214" cy="244" r="7" fill="#5b5d63"/>
    </g>
    <g>
      <circle cx="606" cy="244" r="46" fill="url(#wheelG)"/>
      <circle cx="606" cy="244" r="24" fill="url(#rimG)"/>
      <circle cx="606" cy="244" r="7" fill="#5b5d63"/>
    </g>
  </g>
</svg>
