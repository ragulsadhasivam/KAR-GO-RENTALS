<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ertigaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef0f3"/>
      <stop offset="100%" stop-color="#c9ccd2"/>
    </linearGradient>
    <linearGradient id="ertigaGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454b57"/>
      <stop offset="100%" stop-color="#1c1f26"/>
    </linearGradient>
    <radialGradient id="wheelG2" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a4a52"/>
      <stop offset="100%" stop-color="#111114"/>
    </radialGradient>
    <linearGradient id="rimG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e9ec"/>
      <stop offset="100%" stop-color="#9a9ca3"/>
    </linearGradient>
    <linearGradient id="floorShadow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="400" cy="300" rx="320" ry="18" fill="url(#floorShadow2)"/>

  <g>
    <!-- body: taller, longer roofline (MPV) -->
    <path d="M78 224
      C 78 208 88 198 106 194
      L 140 188
      C 156 148 182 100 226 82
      C 256 68 292 62 330 62
      L 540 62
      C 578 62 606 76 626 104
      L 654 146
      L 700 156
      C 726 162 740 180 742 204
      L 744 226
      C 744 238 736 246 724 246
      L 684 246
      C 684 214 660 190 630 190
      C 600 190 576 214 576 246
      L 236 246
      C 236 214 212 190 182 190
      C 152 190 128 214 128 246
      L 104 246
      C 88 246 78 236 78 224 Z"
      fill="url(#ertigaBody)" stroke="#b7bac1" stroke-width="1.5"/>

    <path d="M226 82 C 256 68 292 62 330 62 L 540 62 C 578 62 606 76 626 104 L 654 146"
      fill="none" stroke="#d8dade" stroke-width="2"/>

    <!-- greenhouse glass with 3 windows (MPV) -->
    <path d="M242 184
      C 258 138 284 96 326 86
      L 520 86
      C 552 86 578 102 596 132
      L 610 184 Z"
      fill="url(#ertigaGlass)"/>
    <path d="M354 86 L 350 184 M 468 86 L 468 184" stroke="#0f1116" stroke-width="3"/>

    <!-- door lines & handles -->
    <path d="M350 186 L 350 246 M468 186 L 468 246" stroke="#c3c6cc" stroke-width="1.5"/>
    <rect x="368" y="190" width="20" height="4" rx="2" fill="#9a9ca3"/>
    <rect x="486" y="190" width="20" height="4" rx="2" fill="#9a9ca3"/>

    <!-- front bumper detail -->
    <rect x="86" y="208" width="34" height="10" rx="5" fill="#0f1116"/>
    <circle cx="100" cy="202" r="5" fill="#f4e2b8"/>

    <!-- rear light -->
    <rect x="712" y="198" width="10" height="28" rx="4" fill="#e5544d"/>

    <!-- grille -->
    <rect x="106" y="224" width="46" height="14" rx="3" fill="#e2e4e8" stroke="#b7bac1"/>

    <!-- roof rail (MPV cue) -->
    <path d="M330 62 L 540 62" stroke="#9a9ca3" stroke-width="3" stroke-linecap="round"/>

    <!-- wheels -->
    <g>
      <circle cx="182" cy="246" r="48" fill="url(#wheelG2)"/>
      <circle cx="182" cy="246" r="25" fill="url(#rimG2)"/>
      <circle cx="182" cy="246" r="7" fill="#5b5d63"/>
    </g>
    <g>
      <circle cx="630" cy="246" r="48" fill="url(#wheelG2)"/>
      <circle cx="630" cy="246" r="25" fill="url(#rimG2)"/>
      <circle cx="630" cy="246" r="7" fill="#5b5d63"/>
    </g>
  </g>
</svg>
